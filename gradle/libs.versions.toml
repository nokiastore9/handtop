[versions]
agp = "9.4.0"
coreKtx = "1.19.0"
annotation = "1.9.1"
androidsvg = "1.4"
junit = "4.13.2"
# Shared Android config
compileSdk = "37"
minSdk = "26"
targetSdk = "37"
ndk = "30.0.16138531"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-annotation = { group = "androidx.annotation", name = "annotation", version.ref = "annotation" }
# Draws the SVG icons of Linux programs (Apache 2.0).
androidsvg = { group = "com.caverock", name = "androidsvg-aar", version.ref = "androidsvg" }
# JVM unit tests.
junit = { group = "junit", name = "junit", version.ref = "junit" }
# The real org.json for JVM unit tests (Android's is a stub there).
org-json = { group = "org.json", name = "json", version = "20240303" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
